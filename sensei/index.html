<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>先生向けの解説｜受けつがれてきたもの</title>
<style>
:root{--paper:#fff;--ink:#2b2d2b;--sub:#6b6f6b;--line:#e2e4e2;--accent:#2e5d7d;--wash:#eef3f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#17191a;--ink:#e6e7e6;--sub:#a3a7a3;--line:#33373a;--accent:#8fb8d6;--wash:#1f2a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.85;font-size:16px;word-break:normal;overflow-wrap:anywhere}
a{color:var(--accent)}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 64px}
header.top{border-bottom:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;max-width:920px;margin:0 auto}
header.top b{font-size:17px}
header.top a{font-size:14px}
h1{font-size:26px;line-height:1.4;margin:28px 0 8px}
h2{font-size:20px;margin:40px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
h3{font-size:17px;margin:28px 0 6px}
.lede{color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:12px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{background:var(--wash);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:14px 0}
.card{display:block;border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card small{display:block;color:var(--sub);font-size:13px}
.card b{font-size:17px}
figure{margin:18px 0 28px}
figure img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px;background:#fff}
figcaption{font-size:14px;color:var(--sub);margin-top:4px}
.jump{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:8px 0 0}
.lock{max-width:420px;margin:12vh auto;padding:24px 16px;text-align:center}
.lock h1{font-size:22px}
.lock p{color:var(--sub);font-size:15px}
.lock-form{display:flex;gap:8px;justify-content:center;margin-top:16px}
.lock-form input{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);width:200px}
.lock-form button{font-size:16px;padding:10px 16px;border:0;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
.lock.busy button{opacity:.5}
.lock-err{color:#c8372d;font-size:14px;min-height:1.5em;margin-top:8px}
#content{display:none}
footer{color:var(--sub);font-size:13px;text-align:center;margin-top:48px}
@media print{header.top,.jump{display:none}figure{break-inside:avoid}}
</style></head><body>
